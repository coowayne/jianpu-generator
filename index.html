<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五線譜轉簡譜工具</title>
  <!-- 引入 PDF 匯出函式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #f8fafc; color: #1e293b; }
    .container { max-width: 1150px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    .upload-zone { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fafafa; }
    .upload-zone:hover, .upload-zone.dragover { border-color: #3b82f6; background: #eff6ff; }
    .preview-container { margin-top: 15px; display: none; text-align: center; }
    .preview-img { max-width: 100%; max-height: 250px; border-radius: 6px; border: 1px solid #e2e8f0; }
    
    .input-row { margin-top: 15px; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .text-input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; width: 220px; }
    
    .btn { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 15px; font-weight: 500; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-pdf { background: #059669; margin-left: 10px; display: none; }
    .btn-pdf:hover { background: #047857; }
    .status-bar { margin-top: 15px; font-weight: 500; font-size: 0.95rem; }
    .error-box { margin-top: 15px; padding: 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; color: #dc2626; font-size: 0.9rem; word-break: break-all; white-space: pre-wrap; display: none; }
    
    /* 簡譜輸出區塊：純白無框線與無陰影 */
    .sheet-wrapper { margin-top: 25px; padding: 10px 0; background: #ffffff; border: none; box-shadow: none; }
    .model-info-footer { margin-top: 25px; padding-top: 10px; border-top: 1px solid #e2e8f0; font-size: 0.85rem; color: #64748b; display: flex; align-items: center; justify-content: space-between; }
    .badge { display: inline-block; padding: 2px 10px; font-size: 0.8rem; font-weight: 600; border-radius: 9999px; background: #e0e7ff; color: #3730a3; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <h1>五線譜轉簡譜工具</h1>
    
    <div class="upload-zone" id="dropZone">
      <p id="uploadText">點擊或拖曳五線譜圖片至此（支援 PNG / JPG）</p>
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>

    <div class="preview-container" id="previewContainer">
      <img id="imagePreview" class="preview-img" alt="樂譜預覽">
      
      <!-- 打譜者輸入欄位 -->
      <div class="input-row">
        <label for="arrangerInput" style="font-weight: 500;">打譜者姓名：</label>
        <input type="text" id="arrangerInput" class="text-input" placeholder="例如：陳大明" value="">
      </div>

      <button class="btn" id="convertBtn" onclick="startConvert()">開始轉換為簡譜</button>
      <button class="btn btn-pdf" id="downloadPdfBtn" onclick="exportToPdf()">下載為 PDF 檔</button>
    </div>

    <div class="status-bar" id="statusBar"></div>
    <div class="error-box" id="errorBox"></div>

    <!-- 簡譜預覽與匯出區域 -->
    <div id="exportableSheet" class="sheet-wrapper" style="display: none;">
      <div id="scoreContainer"></div>
      
      <!-- 引擎與生成時間資訊列（PDF 匯出時會自動隱藏） -->
      <div class="model-info-footer" id="modelFooter">
        <span>樂譜辨識轉換引擎：<span class="badge" id="usedModelBadge"></span></span>
        <span id="genTimestamp"></span>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://jianpu-omr-api.wandering-poetry-ecb7.workers.dev";

    let processedBase64 = "";
    let processedMimeType = "image/jpeg";
    let lastGeneratedTitle = "簡譜樂譜";
    let currentScoreData = null;

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const arrangerInput = document.getElementById("arrangerInput");

    dropZone.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("click", (e) => {
      e.stopPropagation();
    });

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) handleProcessFile(file);
    });

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith("image/")) {
        handleProcessFile(file);
      }
    });

    // 打譜者姓名輸入時即時更新畫面
    arrangerInput.addEventListener("input", () => {
      if (currentScoreData) {
        renderMultiLineJianpu(currentScoreData, "scoreContainer");
      }
    });

    function handleProcessFile(file) {
      document.getElementById("uploadText").innerText = `正在讀取並壓縮：${file.name}...`;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const maxDim = 1600;
          let width = img.width;
          let height = img.height;

          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.85);
          processedBase64 = compressedDataUrl.split(",")[1];
          processedMimeType = "image/jpeg";

          document.getElementById("imagePreview").src = compressedDataUrl;
          document.getElementById("previewContainer").style.display = "block";
          document.getElementById("uploadText").innerText = `已選擇並優化：${file.name}`;
          document.getElementById("errorBox").style.display = "none";
          document.getElementById("downloadPdfBtn").style.display = "none";
          document.getElementById("exportableSheet").style.display = "none";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function startConvert() {
      const btn = document.getElementById("convertBtn");
      const pdfBtn = document.getElementById("downloadPdfBtn");
      const statusText = document.getElementById("statusBar");
      const errorBox = document.getElementById("errorBox");
      const sheet = document.getElementById("exportableSheet");
      const modelBadge = document.getElementById("usedModelBadge");
      const timestamp = document.getElementById("genTimestamp");

      btn.disabled = true;
      pdfBtn.style.display = "none";
      sheet.style.display = "none";
      errorBox.style.display = "none";
      statusText.innerText = "正在辨識樂譜並轉換首調簡譜中，請稍候...";

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            imageBase64: processedBase64,
            mimeType: processedMimeType
          })
        });

        const resData = await res.json().catch(() => ({}));

        if (!res.ok) {
          const errorMsg = resData.details || resData.error || `HTTP 狀態碼 ${res.status}`;
          throw new Error(errorMsg);
        }

        modelBadge.innerText = resData.resolvedModel || "gemini-3.8-flash";
        timestamp.innerText = `生成時間：${new Date().toLocaleString("zh-TW")}`;

        const rawText = resData.candidates[0].content.parts[0].text;
        currentScoreData = JSON.parse(rawText);
        lastGeneratedTitle = currentScoreData.title || "簡譜樂譜";

        statusText.innerText = "轉換成功！已在下方完成多行排版。";
        sheet.style.display = "block";
        pdfBtn.style.display = "inline-block";

        renderMultiLineJianpu(currentScoreData, "scoreContainer");
      } catch (err) {
        statusText.innerText = "轉換失敗";
        errorBox.innerText = `錯誤詳情：\n${err.message}`;
        errorBox.style.display = "block";
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }

    // 音符相容解析函式（全面支援物件及字串編碼）
    function parseNoteToken(token) {
      if (!token) return { pitch: "0", octave: 0, duration: 1, dotted: false };

      if (typeof token === "object") {
        let rawPitch = token.p !== undefined ? token.p : (token.pitch !== undefined ? token.pitch : (token.note !== undefined ? token.note : (token.value !== undefined ? token.value : "0")));
        let pitch = String(rawPitch).trim();
        
        const cleanMatch = pitch.match(/[0-7]/);
        pitch = cleanMatch ? cleanMatch[0] : "0";

        const octave = parseInt(token.o !== undefined ? token.o : (token.octave !== undefined ? token.octave : 0), 10) || 0;
        let duration = parseFloat(token.d !== undefined ? token.d : (token.duration !== undefined ? token.duration : 1)) || 1;
        let dotted = Boolean(token.dot !== undefined ? token.dot : token.dotted);

        if (duration === 1.5) { dotted = true; duration = 1; }
        if (duration === 0.75) { dotted = true; duration = 0.5; }
        if (duration === 3) { dotted = true; duration = 2; }

        return { pitch, octave, duration, dotted };
      }

      const str = String(token).trim();
      const parts = str.split(":");
      
      let rawPitch = parts[0] || "0";
      const cleanMatch = rawPitch.match(/[0-7]/);
      const pitch = cleanMatch ? cleanMatch[0] : "0";

      let octave = parts.length > 1 ? parseInt(parts[1] || "0", 10) : 0;
      let durStr = parts.length > 2 ? parts[2] : "1";
      let dotted = false;

      if (durStr.endsWith(".")) {
        dotted = true;
        durStr = durStr.slice(0, -1);
      }
      let duration = parseFloat(durStr) || 1;
      if (duration === 1.5) { dotted = true; duration = 1; }
      if (duration === 0.75) { dotted = true; duration = 0.5; }
      if (duration === 3) { dotted = true; duration = 2; }

      return { pitch, octave, duration, dotted };
    }

    // 整合 MusicXML 拍數基準校準與大尺寸滿版排版引擎
    function renderMultiLineJianpu(data, targetId) {
      const target = document.getElementById(targetId);
      const pageWidth = 1080;
      const marginX = 35;
      const measuresPerLine = 4;
      const measureWidth = (pageWidth - marginX * 2) / measuresPerLine;
      const lineHeight = 105;

      const rawMeasures = data.m || data.measures || [];
      const totalLines = Math.ceil(rawMeasures.length / measuresPerLine) || 1;
      const totalSvgHeight = 150 + totalLines * lineHeight + 20;

      // 借鑑 MusicXML：解析拍號計算每小節標準基準拍數
      const timeSig = String(data.timeSignature || "4/4");
      const sigParts = timeSig.split("/");
      const beatsPerMeasure = parseFloat(sigParts[0]) || 4;

      let svg = `<svg id="jianpuSvg" width="${pageWidth}" height="${totalSvgHeight}" viewBox="0 0 ${pageWidth} ${totalSvgHeight}" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif; background: #ffffff; width: 100%; height: auto; display: block;">`;
      
      // 1. 曲目名稱
      svg += `<text x="${pageWidth / 2}" y="42" font-size="28" font-weight="bold" text-anchor="middle">${data.title || "簡譜"}</text>`;

      // 2. 打譜者資訊（標題下方右側）
      const arrangerName = (document.getElementById("arrangerInput").value || "").trim();
      if (arrangerName) {
        svg += `<text x="${pageWidth - marginX}" y="78" font-size="16" font-weight="500" text-anchor="end" fill="#222222">${arrangerName} 打譜</text>`;
      }

      // 3. 調號「1 = X」
      const keyText = `1 = ${data.key || "C"}`;
      svg += `<text x="${marginX}" y="108" font-size="19" font-weight="bold">${keyText}</text>`;

      // 4. 拍號垂直分列排版（上分子、中間橫線、下分母）
      const topNum = sigParts[0] || "4";
      const bottomNum = sigParts[1] || "4";
      const timeSigX = marginX + keyText.length * 12 + 18; 
      const timeSigCenterY = 103;

      svg += `<text x="${timeSigX}" y="${timeSigCenterY - 5}" font-size="15" font-weight="bold" text-anchor="middle">${topNum}</text>`;
      svg += `<line x1="${timeSigX - 10}" y1="${timeSigCenterY}" x2="${timeSigX + 10}" y2="${timeSigCenterY}" stroke="#000" stroke-width="1.4" />`;
      svg += `<text x="${timeSigX}" y="${timeSigCenterY + 13}" font-size="15" font-weight="bold" text-anchor="middle">${bottomNum}</text>`;

      let startY = 175;

      for (let i = 0; i < rawMeasures.length; i++) {
        const currentLine = Math.floor(i / measuresPerLine);
        const col = i % measuresPerLine;
        const lineY = startY + currentLine * lineHeight;
        const startX = marginX + col * measureWidth;
        const endX = startX + measureWidth;

        // 行首小節線
        if (col === 0) {
          svg += `<line x1="${startX}" y1="${lineY - 30}" x2="${startX}" y2="${lineY + 16}" stroke="#000" stroke-width="1.8" />`;
        }

        const measureItem = rawMeasures[i];
        let rawNotes = [];
        if (Array.isArray(measureItem)) {
          rawNotes = measureItem;
        } else if (measureItem && typeof measureItem === "object") {
          rawNotes = measureItem.notes || measureItem.n || [];
        }

        const parsedNotes = rawNotes.map(parseNoteToken);

        // 增時線 (-) 槽位分離
        const visualSlots = [];
        parsedNotes.forEach(n => {
          visualSlots.push({
            type: "note",
            pitch: n.pitch,
            octave: n.octave,
            duration: n.duration,
            dotted: n.dotted
          });

          if (n.duration > 1) {
            const extraDashes = Math.floor(n.duration) - 1;
            for (let d = 0; d < extraDashes; d++) {
              visualSlots.push({ type: "dash" });
            }
          }
        });

        // MusicXML 拍數底線對齊：槽位數不少於拍號容量
        const slotCount = Math.max(visualSlots.length, beatsPerMeasure, 1);
        const slotWidth = (measureWidth - 24) / slotCount;

        visualSlots.forEach((slot, idx) => {
          const itemX = startX + 12 + idx * slotWidth + (slotWidth / 2);

          if (slot.type === "dash") {
            svg += `<text x="${itemX}" y="${lineY - 3}" font-size="28" text-anchor="middle" font-weight="bold">-</text>`;
          } else {
            svg += `<text x="${itemX}" y="${lineY}" font-size="28" text-anchor="middle" font-weight="bold">${slot.pitch}</text>`;

            if (slot.dotted) {
              svg += `<circle cx="${itemX + 14}" cy="${lineY - 5}" r="2.5" fill="#000" />`;
            }

            if (slot.octave > 0) {
              svg += `<circle cx="${itemX}" cy="${lineY - 30}" r="2.8" fill="#000" />`;
            } else if (slot.octave < 0) {
              svg += `<circle cx="${itemX}" cy="${lineY + 13}" r="2.8" fill="#000" />`;
            }

            if (slot.duration === 0.5) {
              svg += `<line x1="${itemX - 11}" y1="${lineY + 8}" x2="${itemX + 11}" y2="${lineY + 8}" stroke="#000" stroke-width="2.2" />`;
            } else if (slot.duration === 0.25) {
              svg += `<line x1="${itemX - 11}" y1="${lineY + 8}" x2="${itemX + 11}" y2="${lineY + 8}" stroke="#000" stroke-width="2.2" />`;
              svg += `<line x1="${itemX - 11}" y1="${lineY + 13}" x2="${itemX + 11}" y2="${lineY + 13}" stroke="#000" stroke-width="2.2" />`;
            }
          }
        });

        // 小節線與雙終止線
        const isLastMeasure = (i === rawMeasures.length - 1);
        if (isLastMeasure) {
          svg += `<line x1="${endX - 6}" y1="${lineY - 30}" x2="${endX - 6}" y2="${lineY + 16}" stroke="#000" stroke-width="1.4" />`;
          svg += `<line x1="${endX}" y1="${lineY - 30}" x2="${endX}" y2="${lineY + 16}" stroke="#000" stroke-width="4.2" />`;
        } else {
          svg += `<line x1="${endX}" y1="${lineY - 30}" x2="${endX}" y2="${lineY + 16}" stroke="#000" stroke-width="1.8" />`;
        }
      }

      svg += `</svg>`;
      target.innerHTML = svg;
    }

    // PDF 匯出函式（純淨置中、無框線、滿版 A4）
    async function exportToPdf() {
      const sheetElement = document.getElementById("exportableSheet");
      const modelFooter = document.getElementById("modelFooter");
      const pdfBtn = document.getElementById("downloadPdfBtn");

      pdfBtn.disabled = true;
      pdfBtn.innerText = "正在產出 PDF...";

      // 截圖前暫時隱藏引擎與時間資訊列
      modelFooter.style.display = "none";

      try {
        const canvas = await html2canvas(sheetElement, {
          scale: 2,
          backgroundColor: "#ffffff",
          useCORS: true,
          logging: false
        });

        const imgData = canvas.toDataURL("image/png");
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF("p", "mm", "a4");

        const pageWidth = pdf.internal.pageSize.getWidth(); // 210mm
        const pageHeight = pdf.internal.pageSize.getHeight(); // 297mm

        // 保留 10mm 邊界進行水平置中排版
        const margin = 10;
        const printWidth = pageWidth - (margin * 2); // 190mm
        const printHeight = (canvas.height * printWidth) / canvas.width;

        const posX = margin;
        const posY = 15;

        pdf.addImage(imgData, "PNG", posX, posY, printWidth, printHeight);
        pdf.save(`${lastGeneratedTitle}_簡譜.pdf`);
      } catch (err) {
        alert("PDF 產出失敗：" + err.message);
      } finally {
        modelFooter.style.display = "flex";
        pdfBtn.disabled = false;
        pdfBtn.innerText = "下載為 PDF 檔";
      }
    }
  </script>
</body>
</html>
